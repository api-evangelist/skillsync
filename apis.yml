aid: skillsync
name: Skillsync
description: >-
  Skillsync gives AI coding sessions a permanent home — "GitHub for your agent
  sessions." Developers install the `skl` CLI, sign in once through the browser,
  and publish a coding session; they can then revisit past work, share the full
  context behind a change, and turn workflows that worked into reusable skills.
  The CLI discovers sessions from Claude Code (full support), Codex and OpenCode
  (beta), and also pi, Campfire, Cursor, Grok, Amp, and Antigravity, and ships a
  Model Context Protocol server (`skl mcp`) that gives an assistant a long memory
  over past and published sessions. Skillsync is a Y Combinator (W2026) company;
  it exposes no public REST API — the CLI and its bundled MCP server are the
  integration surface.
